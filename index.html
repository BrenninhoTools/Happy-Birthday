<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breno's Birthday</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="beams" aria-hidden="true">
<span class="beam"></span>
<span class="beam"></span>
<span class="beam"></span>
<span class="beam"></span>
</div>
<div class="balloons" aria-hidden="true">
<span class="balloon"></span>
<span class="balloon"></span>
<span class="balloon"></span>
<span class="balloon"></span>
<span class="balloon"></span>
<span class="balloon"></span>
<span class="balloon"></span>
<span class="balloon"></span>
</div>
<div class="bunting" aria-hidden="true">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>
<div class="disco" aria-hidden="true"><span></span></div>
<canvas id="confetti"></canvas>
<main class="card">
<p class="badge" id="badge">🎂 Birthday countdown</p>
<h1 id="title">The party starts soon</h1>
<p id="subtitle">The button unlocks when the countdown ends</p>
<section id="countdown" class="clock" aria-live="off">
<div class="unit"><strong id="days">00</strong><span>Days</span></div>
<div class="unit"><strong id="hours">00</strong><span>Hours</span></div>
<div class="unit"><strong id="minutes">00</strong><span>Minutes</span></div>
<div class="unit"><strong id="seconds">00</strong><span>Seconds</span></div>
</section>
<button id="wish" class="locked" disabled>Unlocks when the countdown ends 🔒</button>
<p id="thanks" hidden>Thank you so much! You made my day 🎂</p>
<p id="counter" hidden></p>
<p id="total" hidden></p>
</main>
<script src="script.js"></script>
</body>
</html>
